name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint

  test:
    name: Unit Tests + Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Assemble debug APK (includes license report via Gradle dependency)
        run: ./gradlew assembleDebug

      # The default arm64 Whisper library runs on CPUs without FP16 (#321): it and the
      # ggml libraries it loads must hold no ARMv8.1+ instruction (#322).
      - name: Check default Whisper library is ARMv8.0 only
        run: |
          .github/scripts/test-check-arm64-baseline.sh
          .github/scripts/check-arm64-baseline.sh app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/arm64-v8a

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
