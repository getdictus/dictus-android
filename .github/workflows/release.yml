name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .github/scripts/derive-android-version.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > ${{ github.workspace }}/release.jks

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew assembleRelease

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Dictus ${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/app-release.apk

  bundle:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract and validate version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .github/scripts/derive-android-version.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: |
          umask 077
          base64 -d <<< "$UPLOAD_KEYSTORE" > "$RUNNER_TEMP/upload.jks"

      - name: Build AAB signed with the upload key
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew bundleRelease

      # actions/checkout turns an annotated tag into a lightweight one, losing its message.
      - name: Write the Play release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          .github/scripts/play-release-notes.sh "$RELEASE_TAG" > app/build/outputs/bundle/release/release-notes.json

      - name: Keep the AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/release-notes.json

  # Internal track only: promotion is a manual command, see docs/release-play.md. The Play API
  # refuses an app with no build yet, so this stays off until PLAY_INTERNAL_UPLOAD is 'true'.
  play-internal:
    name: Upload AAB to Play internal track
    needs: bundle
    if: vars.PLAY_INTERNAL_UPLOAD == 'true'
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read
    env:
      GPLAY_VERSION: v1.0.2
      GPLAY_SHA256: e951a13d8a35bdab43e8b4ba25ab22e45bb1487a7d27ae5b97faf2f9bb66c72e
      GPLAY_NO_UPDATE: '1'
      GPLAY_NO_STAR_PROMPT: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: play-bundle

      - name: Install gplay, checking its checksum
        run: |
          curl -fsSL -o gplay "https://github.com/tamtom/play-console-cli/releases/download/$GPLAY_VERSION/gplay-linux-amd64"
          echo "$GPLAY_SHA256  gplay" | sha256sum -c -
          chmod +x gplay

      - name: Check the AAB offline
        run: ./gplay preflight --file app-release.aab --fail-on error

      - name: Upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          GPLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/service-account.json
        run: |
          umask 077
          base64 -d <<< "$PLAY_SERVICE_ACCOUNT" > "$GPLAY_SERVICE_ACCOUNT_JSON"
          ./gplay release \
            --package dev.pivisolutions.dictus \
            --track internal \
            --bundle app-release.aab \
            --release-notes @release-notes.json
